<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <radialGradient id="deepBlueRose" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="90%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="sapphireHydrangea" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </radialGradient>
    <radialGradient id="goldRibbon" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="pearlShine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flowing Gold Ribbon -->
  <path d="M-20 60 C120 120, 240 20, 380 90 C500 150, 640 40, 780 110 C880 160, 960 70, 1040 100" 
    fill="none" stroke="url(#goldRibbon)" stroke-width="18" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)" />
  <path d="M-20 60 C120 120, 240 20, 380 90 C500 150, 640 40, 780 110 C880 160, 960 70, 1040 100" 
    fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Pearl String Swags -->
  <g opacity="0.8">
    <path d="M100 130 Q 220 220 340 140" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" />
    <path d="M500 150 Q 640 230 780 140" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" />
  </g>

  <!-- Large Center Royal Blue Peony -->
  <g transform="translate(500, 100)">
    <!-- Base Petals -->
    <circle cx="0" cy="0" r="62" fill="url(#deepBlueRose)" />
    <path d="M-50 -30 C-30 -70, 30 -70, 50 -30 C70 10, 40 60, 0 65 C-40 60, -70 10, -50 -30 Z" fill="url(#deepBlueRose)" opacity="0.9" />
    <!-- Layered ruffled petals -->
    <path d="M-35 -20 C-20 -50, 20 -50, 35 -20 C50 10, 30 45, 0 48 C-30 45, -50 10, -35 -20 Z" fill="#2563eb" opacity="0.85" />
    <path d="M-25 -10 C-10 -35, 15 -35, 25 -10 C35 15, 20 35, 0 38 C-20 35, -35 15, -25 -10 Z" fill="#3b82f6" opacity="0.85" />
    <circle cx="0" cy="5" r="16" fill="#60a5fa" opacity="0.9" />
    <circle cx="0" cy="5" r="8" fill="#93c5fd" />
    <!-- Gold pollen core -->
    <circle cx="0" cy="5" r="4" fill="#fbbf24" />
  </g>

  <!-- Left Blue Peony -->
  <g transform="translate(240, 80) scale(0.85)">
    <circle cx="0" cy="0" r="58" fill="url(#sapphireHydrangea)" />
    <path d="M-45 -25 C-25 -60, 25 -60, 45 -25 C65 10, 35 55, 0 60 C-35 55, -65 10, -45 -25 Z" fill="url(#deepBlueRose)" opacity="0.9" />
    <circle cx="0" cy="2" r="18" fill="#3b82f6" />
    <circle cx="0" cy="2" r="6" fill="#fef08a" />
  </g>

  <!-- Right Blue Peony -->
  <g transform="translate(760, 90) scale(0.88)">
    <circle cx="0" cy="0" r="58" fill="url(#deepBlueRose)" />
    <path d="M-45 -25 C-25 -60, 25 -60, 45 -25 C65 10, 35 55, 0 60 C-35 55, -65 10, -45 -25 Z" fill="url(#sapphireHydrangea)" opacity="0.9" />
    <circle cx="0" cy="2" r="18" fill="#60a5fa" />
    <circle cx="0" cy="2" r="6" fill="#fef08a" />
  </g>

  <!-- Clusters of Hydrangeas & Blossoms -->
  <g transform="translate(380, 70)">
    <circle cx="-15" cy="0" r="18" fill="#60a5fa" opacity="0.95" />
    <circle cx="15" cy="-5" r="16" fill="#93c5fd" opacity="0.95" />
    <circle cx="0" cy="18" r="15" fill="#3b82f6" opacity="0.95" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" />
  </g>
  <g transform="translate(630, 80)">
    <circle cx="-12" cy="0" r="16" fill="#93c5fd" opacity="0.95" />
    <circle cx="14" cy="-5" r="18" fill="#60a5fa" opacity="0.95" />
    <circle cx="0" cy="16" r="15" fill="#3b82f6" opacity="0.95" />
    <circle cx="0" cy="0" r="5" fill="#fef08a" />
  </g>

  <!-- Golden Leaves & Stems -->
  <path d="M170 120 C140 140, 110 110, 130 90 C150 70, 190 100, 170 120 Z" fill="url(#goldRibbon)" opacity="0.75" />
  <path d="M310 130 C330 160, 370 140, 360 110 C350 90, 300 110, 310 130 Z" fill="url(#goldRibbon)" opacity="0.75" />
  <path d="M680 140 C700 170, 740 150, 730 120 C720 100, 670 120, 680 140 Z" fill="url(#goldRibbon)" opacity="0.75" />
  <path d="M830 120 C860 140, 890 110, 870 90 C850 70, 810 100, 830 120 Z" fill="url(#goldRibbon)" opacity="0.75" />

  <!-- Sparkling Golden Stars & Stardust -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="120" cy="40" r="2.5" />
    <circle cx="280" cy="30" r="2" />
    <circle cx="450" cy="20" r="3" />
    <circle cx="560" cy="25" r="2.5" />
    <circle cx="720" cy="35" r="3" />
    <circle cx="890" cy="45" r="2" />
  </g>
</svg>
